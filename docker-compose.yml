services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: emporio
      POSTGRES_USER: emporio
      POSTGRES_PASSWORD: emporio_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

volumes:
  postgres_data: